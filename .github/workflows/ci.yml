# Тесты и conformance на каждый push в develop и в релизную ветку и на каждый
# pull request. Релизная ветка пушится после каждого влитого тикета: CI идёт
# параллельно работе, а не одним прогоном в конце релиза (#557).
name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Dependencies only: workspace crates are rebuilt anyway, so a rerun of
      # a failed job starts from compiled dependencies (#557).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: okkama-rs -> target
          shared-key: tests-gate
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The gate profile: release optimisations without fat LTO. Linking each
      # test binary with fat LTO took most of the job (#557). The std job and
      # packages gate exercise fat-LTO release binaries (the gate also runs t/).
      # Conformance builds its own debug binary in adapters/rust/.target;
      # the Wave corpora use that debug binary too.
      - name: Build
        working-directory: okkama-rs
        run: cargo build --profile gate --locked -p okkama-cli -p sparrow-cli -p blade-cli
      # Every test binary in parallel, all failures in one report, one retry
      # marked FLAKY (okkama-rs/.config/nextest.toml).
      - name: Test
        working-directory: okkama-rs
        run: cargo nextest run --cargo-profile gate --locked --workspace --profile ci
      - name: Doctests
        working-directory: okkama-rs
        run: cargo test --doc --profile gate --locked --workspace

  # The dev profile of the crates whose checks are debug-only (the ownership
  # linearity check, debug_assertions), off in the gate profile above: before,
  # only the nightly gate ran them, after the merge (#1100, #1093).
  debug:
    name: Tests (debug)
    runs-on: ubuntu-24.04
    env:
      # Line tables are enough for a panic's backtrace; full debug info in some
      # seventy linked test binaries fills the runner's disk (#1100).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: okkama-rs -> target
          shared-key: tests-debug
      - name: Test
        working-directory: okkama-rs
        run: cargo test --locked --no-fail-fast -p okkama-compiler -p okkama-cli

  # The playground's compiler (#1078): okkama-compiler and okkama-wasm build for wasm32, pass clippy there (the
  # wasm-bindgen module is cfg(wasm32), so the host clippy of the Wave never sees it), and the bindgen output stays
  # within the 5 MB compressed budget. The site commits the output per release, as it does the /man/ reference.
  wasm:
    name: Playground wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: okkama-rs -> target
          shared-key: wasm
      - name: wasm-bindgen of Cargo.lock's version
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3}' okkama-rs/Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build
        working-directory: okkama-rs
        run: |
          cargo clippy --locked -p okkama-compiler -p okkama-wasm --target wasm32-unknown-unknown -- -D warnings
          cargo build --locked -p okkama-wasm --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --remove-name-section --remove-producers-section \
            --out-dir ../playground-wasm target/wasm32-unknown-unknown/release/okkama_wasm.wasm
      - name: Size budget (5 MB compressed)
        run: |
          compressed=$(gzip -9 -c playground-wasm/okkama_wasm_bg.wasm | wc -c)
          echo "okkama_wasm_bg.wasm: $(wc -c < playground-wasm/okkama_wasm_bg.wasm) bytes, $compressed gzip"
          test "$compressed" -le 5000000
      - uses: actions/upload-artifact@v5
        with:
          name: playground-wasm
          path: playground-wasm

  conformance:
    name: Conformance (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [sparrow]
    # SQLite 3.41+ (std db/sqlite): в Ubuntu 22.04 только 3.37.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Адаптер собирает реализацию в свой каталог: кэшируем и его.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conformance/adapters/rust/.target
          key: ocs-${{ runner.os }}-${{ hashFiles('okkama-rs/Cargo.lock') }}
          restore-keys: ocs-${{ runner.os }}-
      # Адаптер собирает реализацию с --offline: crates заранее в реестре.
      - name: Fetch crates
        working-directory: okkama-rs
        run: cargo fetch --locked
      - name: Validate the suite
        working-directory: conformance
        run: ./ocs validate
      - name: Run full-release on ${{ matrix.engine }}
        working-directory: conformance
        run: |
          set +e
          ./ocs run --adapter adapters/rust/adapter.json --profile full-release \
            --adapter-env OCS_RUST_ENGINE=${{ matrix.engine }} -j 4 | tee ocs.log
          status=${PIPESTATUS[0]}
          # Каждый непройденный кейс — аннотация (видна в интерфейсе и в API).
          grep -E '^\[ *[0-9]+/ *[0-9]+\] +[A-Z_]+ ' ocs.log | grep -v '\] PASS ' | head -50 |
            while IFS= read -r line; do echo "::error title=OCS ${{ matrix.engine }}::$line"; done
          tail -1 ocs.log
          exit $status
      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conformance-${{ matrix.engine }}
          path: conformance/reports/runs/
          if-no-files-found: ignore

  # Every tracked test_*.py of the tooling (fuzz orchestration, t/ generator,
  # ownership oracle, micro harness, conformance runner): dry, no toolchain (#1092).
  tools:
    name: Tool tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/test-python.sh

  # The declared MSRV (workspace rust-version) builds every target (#41).
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' okkama-rs/Cargo.toml)"
          case "$msrv" in *.*.*) ;; *) msrv="$msrv.0" ;; esac
          rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
          rustc -V
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            okkama-rs/target
          key: msrv-${{ hashFiles('okkama-rs/Cargo.lock') }}
          restore-keys: msrv-
      - name: Check
        working-directory: okkama-rs
        run: cargo check --workspace --all-targets --locked

  # std inline tests on Sparrow, on x86_64 Linux:
  # the core's frame walk, stack maps and code memory there (#27).
  std:
    name: std tests (sparrow)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            okkama-rs/target
          key: std-${{ runner.os }}-${{ hashFiles('okkama-rs/Cargo.lock') }}
          restore-keys: std-${{ runner.os }}-
      - name: Build
        working-directory: okkama-rs
        run: cargo build --release --locked -p okkama-cli
      - name: std tests
        run: python3 tools/gate/std-tests.py
      # Every std file is in the shape `okkama fmt` gives it (#1006).
      - name: std formatted
        run: find std -name '*.ok' -print0 | sort -z | xargs -0 okkama-rs/target/release/okkama fmt --check
