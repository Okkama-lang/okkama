<text x="24" y="204" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Normal end, return, last, next, a thrown error, a panic, a cancelled task: the same order.</text>
<text x="24" y="226" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A budget stop is the only exit that runs nothing (Section 10.13).</text>
