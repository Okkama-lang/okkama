<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img">
<rect width="760" height="300" rx="14" fill="#ffffff" stroke="#dde2e8"/>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b5fb0"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a46"/></marker></defs>
<rect x="24" y="20" width="712" height="262" rx="14" fill="#eef1f5" stroke="#dde2e8" stroke-width="1.6"/>
<text x="40" y="44" fill="#16202b" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">блок main владеет</text>
<rect x="48" y="70" width="200" height="70" rx="12" fill="#fbeee6" stroke="#c2571a" stroke-width="1.6"/>
<text x="64" y="94" fill="#16202b" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">let a = Tag(&quot;a&quot;)</text>
<text x="64" y="114" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">владеет этот блок</text>
<rect x="48" y="170" width="200" height="70" rx="12" fill="#efedf8" stroke="#6b5fb0" stroke-width="1.6"/>
<text x="64" y="194" fill="#16202b" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">let alias = a</text>
<text x="64" y="214" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">второе имя: заём</text>
<path d="M148,168 L148,142" fill="none" stroke="#6b5fb0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m0)"/>
<rect x="300" y="70" width="200" height="70" rx="12" fill="#eaf1f9" stroke="#2f6fb3" stroke-width="1.6"/>
<text x="316" y="94" fill="#16202b" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">look(kept)</text>
<text x="316" y="114" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">параметр берёт взаймы</text>
<rect x="300" y="170" width="200" height="70" rx="12" fill="#fbeee6" stroke="#c2571a" stroke-width="1.6"/>
<text x="316" y="194" fill="#16202b" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">adopt(Tag(&quot;t&quot;))</text>
<text x="316" y="214" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">свежий аргумент усыновлён,</text>
<text x="316" y="232" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">закрыт по концу adopt</text>
<rect x="536" y="70" width="180" height="70" rx="12" fill="#e8f3ec" stroke="#1f7a46" stroke-width="1.6"/>
<text x="552" y="94" fill="#16202b" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">make() is Tag</text>
<text x="552" y="114" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">результат переезжает</text>
<text x="552" y="132" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">к вызывающему</text>
<rect x="536" y="170" width="180" height="70" rx="12" fill="#fbeee6" stroke="#c2571a" stroke-width="1.6"/>
<text x="552" y="194" fill="#16202b" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">let made = make()</text>
<text x="552" y="214" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">теперь владеет блок</text>
<path d="M626,140 L626,168" fill="none" stroke="#1f7a46" stroke-width="1.8" marker-end="url(#m1)"/>
<text x="380" y="270" fill="#5d6b7a" font-family="Golos Text, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">В конце: made, затем a, с новейшего. alias и look ничего не закрывают.</text>
</svg>