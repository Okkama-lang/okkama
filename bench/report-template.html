<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okkama Engine Benchmarks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Standard Okkama benchmark report (generated by report.py; do not edit by hand). */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #16202b; --muted: #5d6b7a; --line: #dde2e8; --soft: #eef1f5;
  --e0: #0f7f86; --e1: #c2571a; --e2: #6b5fb0; --e3: #2f6fb3; --e4: #b0457a; --e5: #63b5ba; --e6: #7a8a3a;
  --good: #1f7a46; --bad: #b3261e;
  --display: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #16202b; --ink: #e6ebf0; --muted: #96a3b1; --line: #263342; --soft: #1c2835;
    --e0: #3cc3c9; --e1: #f08a4b; --e2: #a497ef; --e3: #6aa8ea; --e4: #e78ab8; --e5: #8ad6d9; --e6: #b8c86a;
    --good: #5cc98a; --bad: #ff7a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #16202b; --ink: #e6ebf0; --muted: #96a3b1; --line: #263342; --soft: #1c2835;
  --e0: #3cc3c9; --e1: #f08a4b; --e2: #a497ef; --e3: #6aa8ea; --e4: #e78ab8; --e5: #8ad6d9; --e6: #b8c86a;
  --good: #5cc98a; --bad: #ff7a70; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 44px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4.2vw, 40px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 22px; font-weight: 650; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
section { display: grid; gap: 16px; min-width: 0; }
.lead { font-size: 17px; }
.muted { color: var(--muted); }
code, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
code { font-size: .9em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.tile .big { font: 600 26px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.tile .big small { font-size: 14px; color: var(--muted); font-weight: 500; }
.tile p { font-size: 13px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; min-width: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { font: 500 13px var(--body); color: var(--muted); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible { outline: 2px solid var(--e0); outline-offset: -2px; }
.chart { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: center; }
.row .label { display: grid; gap: 2px; min-width: 0; }
.row .label b { font: 600 13px var(--mono); }
.row .label span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.bars { display: grid; gap: 3px; min-width: 0; }
.bar { position: relative; height: 15px; }
.bar i { display: block; height: 15px; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar em { position: absolute; top: -1px; font: 500 11px/17px var(--mono); font-style: normal; color: var(--ink); white-space: nowrap; padding-left: 6px; }
.axis-note { font-size: 12px; color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
thead th { font: 600 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--soft); }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--mono); }
.chip { display: inline-block; font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 99px; }
.chip.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
.chip.even { color: var(--muted); background: var(--soft); }
.best { font-weight: 600; }
.findings { display: grid; gap: 12px; }
.finding { display: grid; grid-template-columns: 120px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.finding:first-child { border-top: 0; padding-top: 0; }
.finding .tag { font: 600 12px var(--mono); color: var(--muted); }
.finding div { display: grid; gap: 6px; min-width: 0; }
.priorities { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: p; }
.priorities li { counter-increment: p; display: grid; grid-template-columns: 34px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.priorities li::before { content: counter(p); font: 600 18px var(--mono); color: var(--e0); }
.priorities li div { display: grid; gap: 4px; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
pre { margin: 0; background: var(--soft); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 13px/1.5 var(--mono); }
footer { font-size: 12px; color: var(--muted); }
@media (max-width: 720px) {
  .row { grid-template-columns: 1fr; gap: 6px; }
  .finding { grid-template-columns: 1fr; gap: 6px; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .35s ease; } }
</style>
