[workspace]
resolver = "3"
# #1148: vendored dependencies are not members (their tests and lints are their own).
exclude = ["vendor"]
members = ["crates/okkama-compiler", "crates/okkama-cli", "crates/okkama-native", "crates/okkama-sparrow", "crates/okkama-runtime-core", "crates/okkama-runtime-abi", "crates/sparrow-cli", "crates/blade", "crates/blade-cli", "crates/sparrow-core", "crates/okkama-persistent", "crates/okkama-devtrace", "crates/okkama-wasm", "crates/sparrow-wasm", "crates/okkama-port"]

[workspace.package]
version = "0.6.7"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# `--cfg okkama_release` (release packaging) compiles the development instrumentation out (okkama-devtrace).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(okkama_release)"] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Межкрейтовое встраивание горячих путей (`Value`, `IntValue`, ops ядра в
# цикле VM и помощниках JIT); unwind остаётся — помощники JIT ловят панику.
[profile.release]
lto = "fat"
codegen-units = 1

# #1109: crates whose code size matters more than their speed: the REPL's line editor, Markdown and TOML of the CLI,
# Brotli, regex-syntax (the parser of path patterns) and SQLite's bundled C (−0.75 MB of the −0.8 MB; its std cells
# moved −1% to +10% in a short probe, and server databases come before SQLite's speed). Linux okkama 25.49 → 24.69 MB.
[profile.release.package.rustyline]
opt-level = "s"
[profile.release.package.pulldown-cmark]
opt-level = "s"
[profile.release.package.toml]
opt-level = "s"
[profile.release.package.libsqlite3-sys]
opt-level = "s"
[profile.release.package.brotli]
opt-level = "s"
[profile.release.package.brotli-decompressor]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"

# Gate tests (`cargo test --profile gate`): release optimizations without
# fat LTO, with parallel code generation to avoid full LTO for each test binary.
# The gate build step produces fat-LTO release binaries for std and t/ tests.
# Conformance builds its own debug binary in conformance/adapters/rust/.target;
# the Wave corpora also use that debug binary.
[profile.gate]
inherits = "release"
lto = "off"
codegen-units = 16

# Отладочные сборки (тесты, адаптер conformance) запускают JIT Sparrow, и
# неоптимизированный Cranelift занимает в них большую часть прогона кейса
# (#761). Оптимизируем только Cranelift и regalloc2; крейты Okkama остаются
# отладочными, с их проверками.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.cranelift-bitset]
opt-level = 2
[profile.dev.package.cranelift-control]
opt-level = 2
[profile.dev.package.cranelift-assembler-x64]
opt-level = 2
[profile.dev.package.cranelift-jit]
opt-level = 2
[profile.dev.package.cranelift-module]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2

# #1148: num-bigint 0.4.8 with an ADCS addition path on aarch64 (vendor/num-bigint/OKKAMA.md); upstream PR pending.
[patch.crates-io]
num-bigint = { path = "vendor/num-bigint" }
cranelift-frontend = { path = "vendor/cranelift-frontend" }
