[package]
name = "okkama-compiler"
description = "Okkama compiler library: parser, analysis, OIR-2 lowering and Sparrow bytecode generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
okkama-devtrace = { path = "../okkama-devtrace" }
# Value types, exact arithmetic and constant folding only: the native providers stay off (#1078).
okkama-runtime-core = { path = "../okkama-runtime-core", default-features = false }
okkama-sparrow = { path = "../okkama-sparrow" }
# Doc comments are a CommonMark subset (#512).
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"

[dev-dependencies]
# Every SPB 17 liveness and allocation of the tests is checked against the algorithms before #755.
okkama-sparrow = { path = "../okkama-sparrow", features = ["liveness-reference"] }
# Compiler → verified SPB → runtime integration fixtures.
sparrow-core = { path = "../sparrow-core" }

[lints]
workspace = true
