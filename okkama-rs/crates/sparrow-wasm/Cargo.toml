[package]
name = "sparrow-wasm"
description = "Sparrow for the playground (#1125): its interpreter and pure providers under the playground's profile, running an SPB from okkama-wasm, as a JSON API in WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the playground's runtime wasm; rlib: the native parity test against the CLI (okkama-cli/tests/playground_run.rs).
crate-type = ["cdylib", "rlib"]

[dependencies]
# No JIT, no host: the build #1124 made for wasm32-unknown-unknown.
sparrow-core = { path = "../sparrow-core", default-features = false }
okkama-runtime-core = { path = "../okkama-runtime-core", default-features = false }
serde_json = "1"

# Only the wasm build exports the API to JavaScript and reads the page's clocks; native code calls the Rust functions.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true

[dev-dependencies]
# Programs for the tests of `run`, assembled from Sparrow text.
okkama-sparrow = { path = "../okkama-sparrow" }
