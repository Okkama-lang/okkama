[package]
name = "okkama-cli"
description = "Command-line front end for the Okkama compiler library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
allocation-stats = ["dep:okkama-allocation-counter"]

[[bin]]
name = "okkama"
path = "src/main.rs"

[dependencies]
okkama-devtrace = { path = "../okkama-devtrace" }
okkama-allocation-counter = { path = "../../tools/allocation-counter", optional = true }
mimalloc = { version = "0.1.52", default-features = false }
okkama-compiler = { path = "../okkama-compiler" }
# blade.toml: корни пакетов и зависимости для поиска импортов.
blade = { path = "../blade" }
# Сервер языка (`okkama lsp`).
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0.154"
okkama-runtime-core = { path = "../okkama-runtime-core" }
okkama-sparrow = { path = "../okkama-sparrow" }
sparrow-core = { path = "../sparrow-core", features = ["mimalloc"] }
# Line editing and history in `okkama repl` (#588, owner 2026-11-21).
rustyline = { version = "14.0.0", default-features = false, features = ["with-file-history"] }

# The doctest child monitors its whole-process RSS as a backstop for natives.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", default-features = false, features = ["resource"] }

[lints]
workspace = true
