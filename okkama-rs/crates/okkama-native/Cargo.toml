[package]
name = "okkama-native"
description = "Host cryptography for Sparrow (RustCrypto and aws-lc)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
blake2 = "0.11.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc"] }
# Only for its `zeroize` feature, which ed25519-dalek does not forward: the seed
# copy in `KeypairBytes` (PKCS#8 in and out) is zeroed on drop (#1026).
ed25519 = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm", "der"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
pkcs8 = "0.11"
aws-lc-rs = "=1.18.2"
aws-lc-sys = "=0.46.0"
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = "0.11.0"
sha3 = "0.12.0"
shake = "0.1.0"
spki = "0.8"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

# unsafe разрешён только в
# `rsa_public` (низкоуровневая проверка подписей RSA через aws-lc) и в
# `secure` (arc4random_buf на системах Apple).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
