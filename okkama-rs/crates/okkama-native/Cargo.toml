[package]
name = "okkama-native"
description = "Host cryptography for Sparrow (RustCrypto and aws-lc)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["aws-lc"]
# aws-lc (a C library): RSA, X.509 signature checks and the ECDSA verification fast path (`rsa_public`, `x509`,
# `ops::rsa_op`). Without it RSA and X.509 are refused as unsupported, ECDSA verifies through RustCrypto (#1142), and
# the rest, RustCrypto, is pure Rust, which builds for wasm32-unknown-unknown (#1124). Every runtime that has the host
# keeps it on.
aws-lc = ["dep:aws-lc-rs", "dep:aws-lc-sys"]

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
blake2 = "0.11.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc"] }
# Only for its `zeroize` feature, which ed25519-dalek does not forward: the seed
# copy in `KeypairBytes` (PKCS#8 in and out) is zeroed on drop (#1026).
ed25519 = { version = "3.0.0", default-features = false, features = ["zeroize"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm", "der"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
pkcs8 = "0.11"
aws-lc-rs = { version = "=1.18.2", optional = true }
aws-lc-sys = { version = "=0.46.0", optional = true }
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = "0.11.0"
sha3 = "0.12.0"
shake = "0.1.0"
spki = "0.8"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

# Platform randomness off Apple systems (`secure`). On wasm32-unknown-unknown it asks the JavaScript host
# (`crypto.getRandomValues`): getrandom has no backend there without its `wasm_js` feature (#1124).
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
getrandom = "0.4.3"
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# unsafe разрешён только в
# `rsa_public` (низкоуровневая проверка подписей RSA через aws-lc), в
# `secure` (arc4random_buf на системах Apple) и в одном тесте `ops`
# (#1026: `drop_in_place`, чтобы проверить, что сид Ed25519 обнуляется; #1097).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
