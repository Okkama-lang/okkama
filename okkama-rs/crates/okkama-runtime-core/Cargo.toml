[package]
name = "okkama-runtime-core"
description = "Compiler-independent runtime values and exact integer arithmetic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
allocation-scopes = ["dep:okkama-allocation-counter"]
# Every native provider (#1078): what every runtime with a host turns on. The compiler leaves it off: it uses the
# value types, exact arithmetic and constant folding only, and builds for wasm32 without it. The parts (#1124):
native = ["providers", "host", "zstd", "brotli", "crypto", "cldr"]
# The pure providers, which build for wasm32-unknown-unknown: the runtime tables (`data`), text, numbers, Unicode,
# formats, JSON splitting, IDNA, time zones, CLDR, diff and layout, DEFLATE/zlib/gzip (miniz_oxide), UUIDs.
providers = [
    "dep:miniz_oxide", "dep:unicode-normalization", "dep:unicode-segmentation", "dep:md-5", "dep:sha1",
]
# The CLDR tables in the binary (#1125). Without them a family is there once its file is given
# (`native::provide_cldr`): the playground's runtime fetches the files a program needs (0.9 MB compressed) instead of
# carrying them within its 2 MB.
cldr = ["providers"]
# Digests through okkama-native's RustCrypto (pure Rust; aws-lc stays behind `host`).
crypto = ["providers", "dep:okkama-native"]
# The host: the process's directory and environment (`host`), the file system, signals, the terminal and
# accounts, host facts, collation through the system's ICU, X.509 with the system's certificates (aws-lc).
host = ["providers", "crypto", "dep:libc", "okkama-native/aws-lc"]
# The zstd (a C library) and Brotli codecs (#184).
zstd = ["providers", "dep:zstd"]
brotli = ["providers", "dep:brotli"]

[dependencies]
okkama-allocation-counter = { path = "../../tools/allocation-counter", optional = true }
okkama-runtime-abi = { path = "../okkama-runtime-abi" }
# Tries for chains of `replaced` (#335), as on Tomato.
okkama-persistent = { path = "../okkama-persistent" }
# Длинная арифметика `int` (Karatsuba/Toom-3, двоичные разряды).
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
# Platform randomness, digests and certificate store (runtime/system,
# runtime/crypto, runtime/x509), Rust API.
okkama-native = { path = "../okkama-native", default-features = false, optional = true }

# Вызовы ОС без обёртки std (renameat2/renamex_np, терминал, сигналы, учётные записи).
libc = { version = "0.2", optional = true }
# Распаковка gzip-таблиц рантайма (unicode.dat и др.).
miniz_oxide = { version = "0.8", optional = true }
# zstd and Brotli codecs (#184).
zstd = { version = "0.13", default-features = false, optional = true }
brotli = { version = "8", default-features = false, features = ["std"], optional = true }
# Нормализация Unicode (NFC/NFD/NFKC/NFKD), как java.text.Normalizer.
unicode-normalization = { version = "0.1", optional = true }
# Кластеры графем для ширины текста в терминале.
unicode-segmentation = { version = "1", optional = true }
# Именованные UUID (v3 — MD5, v5 — SHA-1).
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }

[dev-dependencies]
# The environment-switch policy (#1095); only tests read a switch in this crate.
okkama-devtrace = { path = "../okkama-devtrace" }

# unsafe требует локального разрешения и обоснования в native-провайдерах.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
