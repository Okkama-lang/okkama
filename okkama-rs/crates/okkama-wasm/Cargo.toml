[package]
name = "okkama-wasm"
description = "The Okkama compiler for the playground (#1078): check, fmt, the debug views, the IDE layer and the builds sparrow-wasm runs, over a bundled std, as a JSON API in WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the playground's wasm; rlib: the native parity test against the CLI (okkama-cli/tests/playground.rs).
crate-type = ["cdylib", "rlib"]

[dependencies]
okkama-compiler = { path = "../okkama-compiler" }
okkama-sparrow = { path = "../okkama-sparrow" }
# The uncaught failure a run of sparrow-wasm describes, drawn here with the module's sources (#1125).
okkama-runtime-core = { path = "../okkama-runtime-core", default-features = false }
serde_json = "1"

# Only the wasm build exports the API to JavaScript; native code calls the Rust functions.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true
