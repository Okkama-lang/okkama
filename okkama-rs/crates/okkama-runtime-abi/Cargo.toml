[package]
name = "okkama-runtime-abi"
description = "Native operation identities and signatures shared by compiler and runtimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
# Only ext.rs opts into unsafe: immutable C descriptors must be usable as statics.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(okkama_release)"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
